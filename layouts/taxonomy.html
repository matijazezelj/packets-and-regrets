{{ define "main" }}
<header class="page-header"><span class="eyebrow">Index</span><h1>{{ .Title }}</h1></header>
<section class="term-grid">
  {{ range .Data.Terms.ByCount }}<a href="{{ .Page.RelPermalink }}"><strong>{{ .Page.Title }}</strong><span>{{ .Count }} {{ if eq .Count 1 }}note{{ else }}notes{{ end }}</span></a>{{ end }}
</section>
{{ end }}
