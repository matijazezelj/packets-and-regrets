<article class="post-card">
  <div class="post-card-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <span>{{ .ReadingTime }} min read</span>
  </div>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p>{{ .Description | default .Summary | plainify }}</p>
  {{ with .Params.tags }}
    <ul class="tag-list" aria-label="Tags">
      {{ range . }}<li><a href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a></li>{{ end }}
    </ul>
  {{ end }}
  <a class="read-more" href="{{ .RelPermalink }}">Read the field note <span aria-hidden="true">→</span></a>
</article>
